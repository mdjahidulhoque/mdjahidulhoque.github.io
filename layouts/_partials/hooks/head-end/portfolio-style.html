<style>
:root { --pf-accent:#14675c; --pf-ink:#172b38; --pf-muted:#536575; --pf-line:#dce5e8; --pf-card:#fff; --pf-soft:#f4f8f8; }

[id^="portfolio-"] {scroll-margin-top:5rem}
section[id^="portfolio-"]:not(#portfolio-hero) {padding-block:clamp(1.3rem,2.8vw,2.4rem)!important;padding-inline:clamp(1rem,4vw,3rem)!important}

section[id^="portfolio-"]:not(#portfolio-hero) .container,

section[id^="portfolio-"] .prose ul {padding-inline-start:1.4em;margin-block:.6em!important}
section[id^="portfolio-"] .prose a {color:var(--pf-accent);text-underline-offset:.2em;text-decoration-thickness:1px}
section[id^="portfolio-"] .prose a:focus-visible, .pf-controls button:focus-visible {outline:2px solid var(--pf-accent);outline-offset:4px}
section[id^="portfolio-"] .section-heading {margin-bottom:1.3rem!important}
section[id^="portfolio-"] .section-heading h2,section[id^="portfolio-"] h2 {font-size:clamp(1.35rem,1.12rem + .7vw,1.9rem)!important;letter-spacing:-.025em;line-height:1.25;color:var(--pf-ink)}

body:has(a[href="/publications/"].active) article .prose {max-width:68rem;width:100%;}

/* Standalone publication layout: no reserved left sidebar. */
.pf-publication-page{width:min(100% - 3rem,88rem);margin:0 auto;padding:clamp(2rem,4vw,4rem) 0 4rem;color:var(--pf-ink)}

.pf-publication-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(12rem,16rem);gap:clamp(2rem,4vw,4rem);align-items:start}
.pf-publication-body{min-width:0;font-size:clamp(1rem,.96rem + .16vw,1.125rem);line-height:1.65;overflow-wrap:break-word}
.pf-publication-body h2{font-size:clamp(1.3rem,1.6vw,1.85rem);font-weight:700;line-height:1.3;margin:2.5rem 0 1rem;scroll-margin-top:5rem;letter-spacing:-.02em}
.pf-publication-body h2:first-child{margin-top:0}
.pf-publication-body h3{font-size:1.05rem;font-weight:650;color:var(--pf-accent);margin:1.4rem 0 .65rem;scroll-margin-top:5rem}
.pf-publication-body p{border:1px solid var(--pf-line);border-inline-start:3px solid var(--pf-accent);background:var(--pf-card);border-radius:10px;padding:1.25rem 1.5rem;margin:.85rem 0 1rem;line-height:1.65}

.pf-publication-body a,.pf-hero-links a{color:var(--pf-accent);text-decoration:underline;text-underline-offset:.2em}

.pf-publication-toc ul{list-style:none;margin:0;padding:0}
.pf-publication-toc ul ul{padding-inline-start:.75rem}
.pf-publication-toc li{margin:.5rem 0}
.pf-publication-toc a{color:var(--pf-muted);text-decoration:none}
.pf-publication-toc a:hover{color:var(--pf-accent);text-decoration:underline}
/* Custom homepage hero and academic timeline. */
#portfolio-hero{padding:clamp(2rem,5vw,4rem) clamp(1rem,4vw,3rem)!important}
#portfolio-hero .container,#portfolio-hero [class*="max-w-"]{width:100%!important;max-width:78rem!important;margin-inline:auto}
#portfolio-hero .prose{width:100%!important;max-width:78rem!important}
.pf-hero{display:grid;grid-template-columns:minmax(0, .85fr) minmax(0,1.65fr);gap:clamp(2rem,5vw,5rem);align-items:center;text-align:left;color:var(--pf-ink)}
.pf-hero-identity{text-align:center}
.pf-hero-photo{display:block;width:clamp(9rem,16vw,12rem);height:clamp(9rem,16vw,12rem);object-fit:cover;border-radius:50%;margin:0 auto 1.1rem!important;border:4px solid var(--pf-card);box-shadow:0 6px 24px #12303a20}
.pf-hero h1{font-size:clamp(1.8rem,3vw,2.8rem)!important;line-height:1.18;margin:.6rem 0!important;font-weight:750;color:var(--pf-ink)}
.pf-hero .pf-role{font-size:1.12rem;font-weight:650;color:var(--pf-accent);margin:.6rem 0!important}
.pf-hero .pf-affiliation{font-size:.97rem;line-height:1.55;color:var(--pf-muted);margin:.6rem 0!important}
.pf-hero-about h2{font-size:clamp(1.45rem,2.2vw,1.9rem)!important;margin:0 0 1rem!important;font-weight:700;color:var(--pf-ink)}
.pf-hero-about p{line-height:1.75;margin:.75rem 0!important}
.pf-hero-links{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem}
#portfolio-education .pf-list{gap:.85rem}
#portfolio-education .pf-card{padding:1.2rem 1.5rem}
#portfolio-education .pf-card h3{color:var(--pf-ink);font-size:clamp(1.04rem,1.4vw,1.22rem)!important;margin:0 0 .35rem!important;line-height:1.4}
#portfolio-education .pf-card p{color:var(--pf-muted);margin:0!important;line-height:1.55}
#portfolio-education .pf-card p strong{color:var(--pf-accent);font-weight:600}
@media(max-width:960px){.pf-publication-page{width:min(100% - 2rem,72rem)}.pf-publication-layout{grid-template-columns:minmax(0,1fr)}.pf-publication-toc{position:static;order:-1;border:1px solid var(--pf-line);border-radius:8px;padding:1rem}.pf-publication-toc nav>ul{display:flex;flex-wrap:wrap;gap:.25rem 1rem}.pf-publication-toc ul ul{display:none}}
@media(max-width:700px){.pf-hero{grid-template-columns:1fr;gap:1.5rem}.pf-hero-about{text-align:left}.pf-publication-body p{padding:1rem}.pf-publication-header{margin-bottom:1.25rem}}

/* Keep each research theme together, with compact internal spacing. */
section[id^="portfolio-research-"]{padding-block:clamp(.85rem,1.6vw,1.4rem)!important}
section[id^="portfolio-research-"] .section-heading{margin-bottom:.85rem!important}
section[id^="portfolio-research-"] .pf-card{padding:clamp(1rem,1.7vw,1.5rem)!important}
section[id^="portfolio-research-"] .pf-card p{margin-block:.35rem .65rem!important;line-height:1.6!important}
section[id^="portfolio-research-"] .pf-card h3{font-size:1.08em!important;margin-block:.95rem .3rem!important;line-height:1.35!important}
section[id^="portfolio-research-"] .pf-card h3+p{color:inherit}
section[id^="portfolio-research-"] .pf-card ul{margin-block:.3rem .65rem!important}
section[id^="portfolio-research-"] .pf-card li{margin-block:.25rem!important;line-height:1.6!important}
section[id^="portfolio-research-"] .pf-card > :last-child{margin-bottom:0!important}
/* Replace the default visible footer with a minimal portfolio footer. */
footer:not(.pf-personal-footer) {display:none!important}
.pf-personal-footer {border-top:1px solid var(--pf-line);margin:2rem auto 0;padding:1.15rem;text-align:center;font-size:.85rem;line-height:1.6;color:var(--pf-muted)}
.pf-personal-footer a{color:var(--pf-accent);text-underline-offset:.18em}

.pf-edu-list{display:grid;gap:.9rem}
.pf-edu-row{display:flex;align-items:center;justify-content:space-between;gap:1.25rem;border:1px solid var(--pf-line);border-inline-start:3px solid var(--pf-accent);border-radius:10px;background:var(--pf-card);padding:1.1rem 1.4rem}
.pf-edu-info{flex:1;min-width:0}
#portfolio-education .pf-edu-info h3{font-size:clamp(1rem,1.4vw,1.18rem)!important;line-height:1.4;margin:0 0 .35rem!important;color:var(--pf-ink)}
#portfolio-education .pf-edu-info p{margin:.15rem 0!important;line-height:1.5}
.pf-edu-date{color:var(--pf-muted);font-size:.9rem}
.pf-edu-logos{display:flex;align-items:center;justify-content:flex-end;gap:.75rem;flex-shrink:0}
#portfolio-education .pf-edu-logos img{width:auto;max-width:112px;height:64px;object-fit:contain;margin:0!important;padding:4px;background:#fff;border-radius:4px}
@media(max-width:600px){.pf-edu-row{flex-wrap:wrap;padding:1rem}.pf-edu-info{flex-basis:100%}.pf-edu-logos{margin-left:auto}#portfolio-education .pf-edu-logos img{height:48px;max-width:90px}}

.pf-activity-page{width:min(100% - 2rem,72rem);margin:auto;padding:clamp(2rem,4vw,4rem) 0;color:var(--pf-ink)}
.pf-activity-page header{margin-bottom:2rem}
.pf-activity-page header h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:750;line-height:1.2;margin-bottom:.5rem}
.pf-activity-page header p,.pf-activity-location,.pf-activity-meta,.pf-activity-credit{color:var(--pf-muted)}
.pf-activity-list{display:grid;gap:1.2rem;width:100%}
.pf-activity-card{border:1px solid var(--pf-line);border-radius:12px;padding:clamp(1rem,3vw,2rem);background:var(--pf-card);line-height:1.7;min-width:0}
.pf-activity-card h2{font-size:clamp(1.2rem,2vw,1.55rem)!important;font-weight:700;margin:.45rem 0!important;line-height:1.35}
.pf-activity-meta,.pf-activity-credit{font-size:.85rem}
.pf-activity-card p{margin:.6rem 0!important}
.pf-activity-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:.8rem;margin-top:1rem}
.pf-activity-gallery img{width:100%;aspect-ratio:3/2;object-fit:contain;background:var(--pf-soft);border-radius:8px;margin:0!important}
#portfolio-home-2 .pf-activity-gallery{max-width:34rem}
.pf-activity-list a{color:var(--pf-accent)}

.pf-institution-link,#portfolio-experience-1 strong a,#portfolio-experience-2 strong a{color:var(--pf-accent);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}.pf-institution-link:hover,#portfolio-experience-1 strong a:hover,#portfolio-experience-2 strong a:hover{text-decoration-color:currentColor}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!document.querySelector('.pf-personal-footer')){
    const footer=document.createElement('footer');footer.className='pf-personal-footer';
    const contact=document.createElement('a');contact.href='mailto:mdjahidul.hoque@unsdsn.org';contact.textContent='Email';
    footer.append(document.createTextNode('© '+new Date().getFullYear()+' Md. Jahidul Hoque | '),contact);
    document.body.append(footer);
  }
  document.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href');
    if(href==='mailto:mdjahidul.hoque@unsdsn.org'){
      a.href='https://mail.google.com/mail/?view=cm&fs=1&to=mdjahidul.hoque%40unsdsn.org';
      a.target='_blank';a.rel='noopener noreferrer';
      a.title='Compose email in Gmail (opens in a new tab)';
      return;
    }
    if(/^https?:\/\//i.test(href)&&new URL(href,location.href).origin!==location.origin){
      a.target='_blank';a.rel='noopener noreferrer';
    }
  });
  const sections=Array.from(document.querySelectorAll('section[id^="portfolio-"]')).filter(s=>s.id!=='portfolio-hero');
  const prose=s=>s.querySelector('.prose');
  function cards(s,mode,selector){
    const p=prose(s);if(!p)return;
    const nodes=Array.from(p.children).filter(n=>n.matches(selector||'p'));
    if(!nodes.length)return;
    const wrap=document.createElement('div');wrap.className=mode;
    nodes[0].before(wrap);
    nodes.forEach(n=>{const card=document.createElement('article');card.className='pf-card';wrap.append(card);card.append(n);});
    return wrap;
  }
  function group(s,byHeading){
    const p=prose(s);if(!p)return;
    const nodes=Array.from(p.children);if(!nodes.length)return;
    const wrap=document.createElement('div');wrap.className='pf-list';p.prepend(wrap);
    let card=null;
    nodes.forEach(n=>{
      if(!card||(byHeading&&n.tagName==='H3')){
        card=document.createElement('article');card.className='pf-card';wrap.append(card);
      }
      card.append(n);
    });
  }
  sections.forEach(s=>{
    const id=s.id,p=prose(s);if(!p)return;
    if(id==='portfolio-home-1'||id==='portfolio-profile-summary-5'||id==='portfolio-experience-3'){
      cards(s,'pf-grid','p:has(> strong)');
    }else if(id==='portfolio-home-2'||id==='portfolio-publications-1'||id==='portfolio-profile-summary-6'){
      const w=cards(s,'pf-list','p:has(> strong)');if(w&&id==='portfolio-publications-1'){
        const controls=document.createElement('div');controls.className='pf-controls';
        const input=document.createElement('input');input.type='search';input.placeholder='Search journal articles';input.setAttribute('aria-label','Search journal articles');
        const count=document.createElement('span');count.className='pf-count';count.setAttribute('aria-live','polite');
        controls.append(input,count);w.before(controls);
        const update=()=>{let n=0;Array.from(w.children).forEach(c=>{c.hidden=!c.textContent.toLowerCase().includes(input.value.trim().toLowerCase());if(!c.hidden)n++});count.textContent=n+' article'+(n===1?'':'s')};
        input.addEventListener('input',update);update();
      }
    }else if(id==='portfolio-profile-summary-4'||id==='portfolio-profile-summary-8'){cards(s,'pf-grid','p');}
    else if(id==='portfolio-publications-5'||id==='portfolio-publications-2'||id==='portfolio-publications-3'){cards(s,'pf-list','p');}
    else if(id==='portfolio-publications-4'){group(s,true);}
    else if(id==='portfolio-experience-1'||id==='portfolio-experience-2'||id==='portfolio-profile-summary-2'||id==='portfolio-profile-summary-3'){
      group(s,true);
    }else if(id==='portfolio-profile-summary-7'){cards(s,'pf-grid','p');}
    else if(/^portfolio-research-[234]$/.test(id)){group(s,false);}
    else if(id==='portfolio-experience-4'||id.startsWith('portfolio-research-')||id==='portfolio-profile-summary-1'||id==='portfolio-publications-6'||id==='portfolio-home-3'){
      group(s,false);
    }
  });
  if(sections.length>3&&location.pathname!=='/'){
    const nav=document.createElement('nav');nav.className='pf-jump';nav.setAttribute('aria-label','On this page');
    const label=document.createElement('strong');label.textContent='On this page';nav.append(label);
    sections.forEach(s=>{const h=s.querySelector('h2')||s.querySelector('.section-heading');if(!h)return;const a=document.createElement('a');a.href='#'+s.id;a.textContent=h.textContent.trim();nav.append(a);});
    if(nav.children.length>1){const p=prose(sections[0]);if(p)p.before(nav);}
  }
});
</script>
