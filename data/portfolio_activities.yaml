  category: "Academic milestone"
  description: "Attended the Graduate School Biosphera graduation ceremony at Université Paris-Saclay, celebrating the successful completion of my second Master's degree in Climate, Land Use and Ecosystem Services, pursued at AgroParisTech and Université Paris-Saclay. This milestone marks an important step in my academic journey, strengthening my research background in climate science, terrestrial ecosystem modelling and environmental sustainability."
