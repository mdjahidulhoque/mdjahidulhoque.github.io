- title: "Representing FABLE at the CHOICE Final Event"
  date: "2026-10-08"
  date_display: "8-9 October 2026"
  location: "Athens, Greece"
  category: "Conference & Presentation"
  description: "Represented the FABLE Consortium at the UN Sustainable Development Solutions Network (SDSN) during the final event of the EU-funded CHOICE project in Athens, Greece. I presented FABLE's contributions to strengthening the links between Integrated Assessment Models (IAMs) and environmental impact assessments, highlighting the role of the FABLE Calculator in exploring sustainable food and land-use pathways and assessing their implications for greenhouse gas emissions, biodiversity and water resources. The event marked the culmination of three years of interdisciplinary research involving 16 partner organisations across eight countries."
