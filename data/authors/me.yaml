    end: 2025-10-31
    summary: |
      - Advanced training in climate science, land-use change, ecosystem services, and terrestrial biosphere modelling.
      - Studied biosphere-atmosphere interactions, land-surface processes, and ecosystem responses to environmental change.
      - Conducted research on improving photosynthesis and gross primary productivity representation using chlorophyll-fluorescence observations.

