bio: |
  I am an environmental researcher and data analyst working at the intersection of climate change,
  land-use systems, agriculture, water resources, and ecosystem modelling. I currently work with
  the FABLE Consortium at the UN Sustainable Development Solutions Network (UN SDSN), contributing
  to environmental data development and analytical workflows that support integrated food, land,
  water, and climate systems.

  My research background is centred on terrestrial biosphere modelling, biosphere–atmosphere
  interactions, and photosynthesis modelling. During my Master's research at the Laboratory for
  Climate and Environmental Sciences (LSCE), I investigated the use of solar-induced chlorophyll
  fluorescence (SIF) and eddy-covariance observations to improve photosynthesis and gross primary
  productivity (GPP) estimation within the ORCHIDEE terrestrial biosphere model.

  I am interested in integrating process-based ecosystem models, Earth observation, geospatial
  analysis, and environmental data science to better understand ecosystem responses to climate
  and environmental change.

