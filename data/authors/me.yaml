role: Environmental Data Analyst and Researcher

bio: |
  I am a Data Analyst with the FABLE Consortium at the UN Sustainable Development Solutions Network (UN SDSN), based in Paris, France. My work combines environmental data science, geospatial analysis and integrated food, land, water and climate modelling.

  My research focuses on terrestrial biosphere processes, photosynthesis and ecosystem carbon fluxes, with experience in ORCHIDEE, chlorophyll fluorescence and eddy-covariance observations.

