      - Developed experience in environmental assessment, quantitative data analysis, and GIS.
      - Completed interdisciplinary training across environmental science and sustainability.

experience:
  - role: Data Analyst
    org: 'FABLE Consortium, UN Sustainable Development Solutions Network (UN SDSN)'
    start: 2026-06-22
    summary: |
      - Develop and harmonise agricultural water datasets covering 56 products across 179 countries, including irrigated areas, crop-specific irrigation requirements and irrigation technology efficiencies.
      - Build reproducible Python workflows for agricultural production, food balances, bilateral trade and land-use data, with harmonisation, validation and quality-control checks.
      - Analyse spatial land-use transitions and associated greenhouse gas indicators using FABLE Downscaling within the CHOICE project; contribute to technical documentation and dissemination.
      - Develop FABLE-C trade-adjustment workflows and integrate fair-share calculations into a web application; support climate-impact and nutrient-related data reviews.
      - Use Google Earth Engine to analyse climate extremes and land-cover datasets.
      - Support SOLVE consortium coordination, work-package activities, milestones, deliverables and communication with international partners.

  - role: Research Intern
    org: 'Laboratory for Climate and Environmental Sciences (LSCE), CEA-CNRS | MOSAIC Team'
    start: 2025-05-01
    end: 2025-10-31
    summary: |
      - Implemented and evaluated the Johnson & Berry mechanistic photosynthesis formulation in ORCHIDEE, including early work towards fluorescence-constrained analyses.
      - Analysed ecosystem observations and model outputs from seven European sites using parameter sensitivity analysis and model-data evaluation.
      - Compiled pulse-amplitude modulation (PAM) chlorophyll fluorescence data and conducted quantitative synthesis of photosynthesis and fluorescence metrics across ecosystems.

  - role: Research Assistant
    org: 'Dr. Murad Ahmed Farukh''s Lab, Bangladesh Agricultural University'
    start: 2022-11-01
    end: 2024-04-30
    summary: |
      - Contributed to FAO-funded research on agricultural land transformation in the Ganges-Padma floodplain.
      - Analysed land-use and land-cover change using Google Earth Engine, satellite imagery, GIS and quantitative methods, integrating field observations for validation.
      - Conducted farmer surveys and contributed to scientific writing and peer-reviewed publications.

  - role: Research Assistant
    org: 'Department of Environmental Science and Disaster Management, NSTU'
    start: 2020-01-01
    end: 2022-07-31
    summary: |
      - Supported field and laboratory research on soil and water quality, environmental monitoring and ecological assessment.
      - Conducted GIS, remote sensing and statistical analyses and trained undergraduate students in programming and environmental data interpretation.

