bio: |
  I am a Data Analyst with the FABLE Consortium at the UN Sustainable Development Solutions Network (UN SDSN), based in Paris, France. My work focuses on model-ready environmental datasets and integrated agricultural systems modelling, particularly irrigation water requirements, water resources and nitrogen-related environmental indicators.

  My research focuses on terrestrial biosphere processes, photosynthesis and ecosystem carbon fluxes, with experience in ORCHIDEE, chlorophyll fluorescence and eddy-covariance observations.

